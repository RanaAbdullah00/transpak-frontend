<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=4" />
    <title>TransPak - Digital Freight Exchange</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <script>
      (function () {
        var t = localStorage.getItem('transpak_theme');
        var dark = t === 'dark';
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (dark) document.body.classList.add('dark-theme');
      })();
    </script>
    <div id="root"></div>
    <div id="tp-portal-root" data-tp-portal-root="true"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
